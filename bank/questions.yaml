    实现 bounded_knapsack(items, capacity)。items 按输入顺序编号 0..n-1，每项 [weight,value]，每项最多选一次；总 weight 不超过 capacity，最大化 value；并列时选编号升序字典序更小的集合。返回 {value, weight, indices}。输入规模很小，必须求全局最优而非贪心。
