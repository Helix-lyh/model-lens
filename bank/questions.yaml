- id: architecture-hard-05
  domain: architecture
  difficulty: hard
  pass_criteria: outbox 事务和消费幂等的顺序、状态及重试策略完整
  prompt: |
    下单事务同时写 orders 和 outbox，消息发送可能失败，消费者可能重复收到同一 event_id。请只输出 JSON，字段为 atomic_write、publisher_retry、consumer_key、ack_order、dead_letter、replay。
    atomic_write 取 ONE_DB_TRANSACTION / TWO_PHASE_COMMIT；publisher_retry 取 RETRY_UNSENT / RETRY_ALL；consumer_key 取 event_id / order_id；ack_order 取 COMMIT_THEN_ACK / ACK_THEN_COMMIT；dead_letter 取 AFTER_MAX_RETRIES / DROP_FIRST_FAIL；replay 取 IDEMPOTENT / LAST_WRITE_WINS。六个字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_hard_05.py
- id: architecture-extreme-01
  domain: architecture
  difficulty: extreme
  pass_criteria: 拒绝占号、部分冲正与后续余额相互作用
  prompt: '钱包初始20，事件依次为 a debit15、b debit10、a credit50、c credit8、d refund(a,6)、e refund(a,10)、f debit12。id首次出现即占用，重复DUP；debit余额不足FUNDS；refund只能退此前成功debit尚未退的额度，不足REFUND_LIMIT，不改变余额。其余成功APPLY。按收到顺序处理。输出JSON：actions、balance、refundable_a（a剩余可退额度）、seen（全部首次id按顺序）。actions 必须是与事件等长的字符串数组，元素只能是 APPLY、DUP、FUNDS、REFUND_LIMIT；balance、refundable_a 为整数；seen 为 id 字符串数组。

    '
  grader:
    type: structure
    tests_file: bank/tests/v2_architecture_extreme_01.py
  metadata:
    version: "2026090901"
    construct: reasoning
    reference_answer:
      actions:
      - APPLY
      - FUNDS
      - DUP
      - APPLY
      - APPLY
      - REFUND_LIMIT
      - APPLY
      balance: 7
      refundable_a: 9
      seen: &q8id001
      - a
      - b
      - c
      - d
      - e
      - f
    equivalence: JSON 对象键顺序不计；数组顺序、类型及字符串精确；内容题可单一围栏。actions 是与事件等长的字符串数组，元素只能是 APPLY、DUP、FUNDS、REFUND_LIMIT；balance、refundable_a 为整数；seen 为 id 字符串数组。
    negative_example:
      actions: null
      balance: 7
      refundable_a: 9
      seen: *q8id001
    rationale: 拒绝占号、部分冲正与后续余额相互作用

- id: architecture-extreme-02
  domain: architecture
  difficulty: extreme
  pass_criteria: 发布回滚时间线含不可逆迁移和读写兼容窗口
  prompt: |
    服务 v1 使用字段 price_cents，v2 需要 amount_cents。发布步骤固定：先部署能读旧写双字段的 v1.5；再双写；观察 10 分钟；最后切读。第 6 分钟发现 v2 错误率升高，但已有 120 条记录只写了 amount_cents。只输出 JSON：read_mode、rollback_mode、data_action、compat_window、lost_records。枚举必须来自：read_mode=OLD_FIRST/NEW_FIRST；rollback_mode=ROLL_BACK_APP_ONLY/ROLL_BACK_DATA；data_action=BACKFILL_THEN_RETRY/DROP_NEW_ONLY。compat_window 和 lost_records 为整数；lost_records 只计无法回填的丢失条数。
    五个字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_02.py
