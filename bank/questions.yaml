# 题库 20–60 题。编号：domain-difficulty-序号，例如 coding-medium-01。
# 快速模式只跑 easy/medium；全量三档都跑。架构/知识只进附录；编码进 I 附录与 D。
# 每题若干得分点，折合满分 10；只分域/分难度展示，不合成总分。
- id: architecture-easy-01
  domain: architecture
  difficulty: easy
  pass_criteria: 缓存对象、键设计、防击穿至少命中 3 点
  prompt: |
    商品详情页 QPS 很高，数据库已被打满。要加一层缓存。
    说明：缓存什么数据、键如何设计、如何降低缓存击穿/穿透风险。
  grader:
    type: keyword
    min_hits: 4
    must_exclude:
    - - 综上所述
    - - 总而言之
    - - 作为一名
    must_include:
    - - 缓存
      - cache
    - - 键
      - key
      - 商品id
      - sku
    - - 击穿
      - 穿透
      - 空值
      - 布隆
      - 互斥锁
      - singleflight
    - - 过期
      - ttl
      - 失效
    - - 热点
      - 预热
- id: architecture-easy-02
  domain: architecture
  difficulty: easy
  pass_criteria: session 与 JWT 适用差别
  prompt: |
    对比服务端 Session 与 JWT：各自适合什么场景？注销、密钥轮换、体积方面有何差别？
  grader:
    type: keyword
    min_hits: 4
    must_exclude:
    - - 综上所述
    - - 总而言之
    - - 作为一名
    must_include:
    - - session
      - 会话
    - - jwt
      - token
    - - 注销
      - 吊销
      - 失效
    - - 无状态
      - 服务端
      - 存储
    - - 体积
      - 密钥
      - 轮换
- id: architecture-easy-03
  domain: architecture
  difficulty: easy
  pass_criteria: 队列用途与至少一次/幂等
  prompt: |
    下单成功后要发短信和积分。直接在下单接口里同步调用会超时。
    为何引入消息队列？如何做到至少投递一次，同时避免重复加积分？
  grader:
    type: keyword
    min_hits: 4
    must_exclude:
    - - 综上所述
    - - 总而言之
    - - 作为一名
    must_include:
    - - 队列
      - 异步
      - mq
      - 解耦
    - - 至少一次
      - at-least-once
      - 重试
    - - 幂等
      - 去重
      - 重复消费
    - - 消费者
      - 投递
      - 确认
      - ack
- id: architecture-medium-01
  domain: architecture
  difficulty: medium
  pass_criteria: 覆盖「何时不该拆」的至少 3 个工程要点
  prompt: |
    一个 8 人团队的内部工单系统目前是单体，日请求量不高。有人提议立刻拆成十几个微服务。
    请用条目说明：什么情况下不该拆？拆早了会付出哪些成本？
  grader:
    type: keyword
    min_hits: 4
    must_exclude:
    - - 综上所述
    - - 总而言之
    - - 作为一名
    must_include:
    - - 不该拆
      - 别拆
      - 先别拆
      - 过早拆
      - 不要拆
    - - 团队
      - 沟通
      - 协作成本
      - 认知负担
    - - 事务
      - 一致性
      - 分布式事务
    - - 运维
      - 部署
      - 复杂度
      - 可观测
    - - 边界
      - 领域
      - 模块
- id: architecture-medium-02
  domain: architecture
  difficulty: medium
  pass_criteria: 网关限流/超时/重试取舍
  prompt: |
    API 网关上要配置限流、超时和重试。
    说明这三项各自防什么，以及重试为什么可能把故障放大。
  grader:
    type: keyword
    min_hits: 4
    must_exclude:
    - - 综上所述
    - - 总而言之
    - - 作为一名
    must_include:
    - - 限流
      - 配额
      - rate
    - - 超时
      - timeout
    - - 重试
      - retry
    - - 雪崩
      - 放大
      - 重试风暴
      - 幂等
- id: architecture-medium-03
