        tests_file: bank/tests/ts/mvcc.ts
        signature: "export function applyTransactions(initial: Record<string, number>, txns: Array<{id: string; begin: number; writes: Record<string, number>; commit: number}>): {state: Record<string, number>; statuses: Record<string, string>}"
