    '
  grader:
    type: structure
    tests_file: bank/tests/v2_architecture_hard_01.py
    strict_response: true
  metadata:
    version: "2026090901"
    construct: instruction_following
    reference_answer:
      status: OK
      kept: &q3id001
      - c
      - a
      trace: &q3id002
      - TAKE
      - DENY
      - TAKE
      - DUP
      remaining: 0
    equivalence: 指令题键顺序必须与分支说明一致；OK 分支中 trace、kept 为字符串数组，remaining 为整数；IMPOSSIBLE 分支只有 status 与 conflict。原始响应须为单行紧凑JSON，无首尾空白或围栏。
    negative_example:
      status: null
      kept: *q3id001
      trace: *q3id002
      remaining: 0
    rationale: 优先级、首次拒绝占号、逆序投影、引文隔离及不可满足分支

