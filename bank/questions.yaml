# 题库 20–60 题。编号：domain-difficulty-序号，例如 coding-medium-01。
# 编码题加载时按 python/go/typescript 展开为 coding-medium-01-python 等。
# 快速模式只跑 easy/medium；全量三档都跑。架构/知识只进附录；编码进 I 附录与 D。
# 每题若干得分点，折合满分 10；只分域/分难度展示，不合成总分。
- id: architecture-easy-01
  domain: architecture
  difficulty: easy
  pass_criteria: 缓存对象、键设计、防击穿至少命中 3 点
  prompt: |
    商品详情页 QPS 很高，数据库已被打满。要加一层缓存。
    说明：缓存什么数据、键如何设计、如何降低缓存击穿/穿透风险。
  grader:
    type: keyword
    min_hits: 4
    must_exclude:
    - - 综上所述
    - - 总而言之
    - - 作为一名
    must_include:
    - - 缓存
      - cache
    - - 键
      - key
      - 商品id
      - sku
    - - 击穿
      - 穿透
      - 空值
      - 布隆
      - 互斥锁
      - singleflight
    - - 过期
      - ttl
      - 失效
    - - 热点
      - 预热
