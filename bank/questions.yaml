# Active bank: 50 raw questions. Global difficulty is 5/5/20/20.
# Coding raw questions expand to Python, Go and TypeScript variants; variants share one raw cluster.
# High-difficulty questions require a deterministic structured artifact, not a free-form explanation.
- id: architecture-easy-01
  domain: architecture
  difficulty: easy
  pass_criteria: 缓存对象、键、过期和至少一种击穿防护
  prompt: |
    商品详情页的读流量很高，数据库已经接近满载。用不超过 5 条短句回答：缓存什么、缓存键如何构造、TTL 如何设置，以及一种防止热点击穿的方法。不要讨论微服务拆分。
  grader:
    type: keyword
    min_hits: 4
    must_include:
    - [缓存, cache]
    - [键, key, 商品id, sku]
    - [ttl, 过期, 失效]
    - [击穿, 互斥锁, singleflight, 预热]
    must_exclude:
    - [综上所述]
    - [作为一名]
- id: architecture-medium-01
  domain: architecture
  difficulty: medium
  pass_criteria: 灰度比例、三项观测指标和明确回滚条件
  prompt: |
    一个推荐 API 要从 v1 发布 v2。请用不超过 8 条短句给出灰度方案：第一阶段流量比例、至少三个观测指标、持续窗口，以及一个可执行的回滚条件。不要只写“监控并及时回滚”。
  grader:
    type: keyword
    min_hits: 5
    must_include:
    - [灰度, 金丝雀, canary, 放量, 切流, 分阶段]
    - [5%, 5％, 10%, 10％, 1%, 1％, 白名单, 比例]
    - [错误率, p99, 延迟]
    - [超时, 5xx, 可用率, 点击率, 转化率, cpu]
    - [回滚, rollback]
    must_exclude:
    - [综上所述]
    - [作为一名]
- id: architecture-hard-01
  domain: architecture
  difficulty: hard
  pass_criteria: 识别深分页、给出复合索引、游标边界和精确扫描量
  prompt: |
    orders 表有 1,000,000 行，主键 id，字段 created_at。查询要求按 (created_at DESC, id DESC) 稳定排序，取第 200001–200020 条；上一页最后一条是 created_at=2026-04-01T09:00:00Z、id=780000。请只输出一个 JSON 对象，字段必须是：failure_code、index_columns、pagination、cursor_predicate、rows_scanned。枚举值分别必须来自：OFFSET_SCAN；索引列为数组；KEYSET；cursor_predicate 为 "(created_at,id)<(cursor_time,cursor_id)"；rows_scanned 必须是整数。
    评分：五个字段各 1 分。rows_scanned 按该页 20 行计为 20；不要输出 SQL 或解释。
  grader:
    type: structure
    tests_file: bank/tests/a_hard_01.py
- id: architecture-hard-02
  domain: architecture
  difficulty: hard
  pass_criteria: 2GB 上传的鉴权、直传、分片、扫描和发布状态完整
  prompt: |
    设计一个最大 2GB 视频上传的最小状态摘要。只输出 JSON，字段必须为 auth、transport、parts、scan、publish。固定约束：浏览器直传对象存储；上传 URL 有效期 900 秒；分片大小 16 MiB；上传完成后只能由扫描服务把 QUARANTINED 改为 CLEAN；扫描失败为 REJECTED；未 CLEAN 的对象不可见。每个字段只填约定枚举或整数。
    评分 6 点：五个状态/策略字段和 parts_size 各 1 点。
  grader:
    type: structure
    tests_file: bank/tests/a_hard_02.py
- id: architecture-hard-03
  domain: architecture
  difficulty: hard
  pass_criteria: Redis 锁 token 校验、租约失效、fencing 和脑裂结果准确
  prompt: |
    三个实例执行同一个对账任务。时间线：A 在 t=0 用 token A 获锁，租约 30 秒；A 卡住到 t=35；B 在 t=31 获得新租约并拿到 fencing=8；A 在 t=36 发送续期和写库请求，B 在 t=32 已发送写库请求。规则：租约过期后旧持有者不能续期；存储层只接受不小于当前 fencing token 的写入，并用 token 做原子比较。只输出 JSON，字段为 redis_owner、a_renew、a_write、b_write、brain_split、required_guard。redis_owner 取 A/B；a_renew 取 ACCEPT/REJECT；a_write 和 b_write 取 ACCEPT/REJECT_FENCING；brain_split 为布尔；required_guard 取 COMPARE_AND_SET_TOKEN/LEASE_ONLY。
    六个字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_hard_03.py
- id: architecture-hard-04
  domain: architecture
  difficulty: hard
  pass_criteria: 支付回调乱序、重复和漏单均映射到确定状态动作
  prompt: |
    订单 O9 初始为 CREATED。输入事件按收到顺序为：SUCCESS(seq=4, amount=80)、SUCCESS(seq=4, amount=80)、REFUND(seq=6, amount=20)，而 seq=5 的 SUCCESS 没有收到。对账任务随后查询支付方，得到 PAID(amount=80)。只输出 JSON：events（长度 4 的动作数组）、final_state、ledger_amount、missing_seq、idempotent_key。动作只能从 APPLY_SUCCESS、IGNORE_DUPLICATE、APPLY_REFUND、RECONCILE_GAP 中选择；final_state 只能是 CREATED/PAID/PARTIALLY_REFUNDED/REFUNDED；idempotent_key 必须是 "payment_id+seq"；ledger_amount 是整数；missing_seq 是整数数组。
    五个字段各 1 分，events 只有完全正确才得分。
  grader:
    type: structure
    tests_file: bank/tests/a_hard_04.py
- id: architecture-hard-05
  domain: architecture
  difficulty: hard
  pass_criteria: outbox 事务和消费幂等的顺序、状态及重试策略完整
  prompt: |
    下单事务同时写 orders 和 outbox，消息发送可能失败，消费者可能重复收到同一 event_id。请只输出 JSON，字段为 atomic_write、publisher_retry、consumer_key、ack_order、dead_letter、replay。答案必须使用固定枚举：atomic_write=ONE_DB_TRANSACTION；publisher_retry=RETRY_UNSENT；consumer_key=event_id；ack_order=COMMIT_THEN_ACK；dead_letter=AFTER_MAX_RETRIES；replay=IDEMPOTENT。六个字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_hard_05.py
- id: architecture-extreme-01
  domain: architecture
  difficulty: extreme
  pass_criteria: 乱序事件状态机逐步动作、余额和异常清单全部正确
  prompt: |
    钱包 W 的初始余额为 100。按收到顺序处理事件：credit(seq=2, amount=40)、debit(seq=1, amount=30)、debit(seq=1, amount=30)、credit(seq=3, amount=10)、refund(seq=4, target_seq=2, amount=10)。规则：相同事件 seq 只接受第一次；接受事件按收到顺序执行，不按 seq 排序；debit 余额不足则 REJECT_FUNDS 并占用该 seq；refund 只对已接受的 debit 生效，否则 FLAG，且 FLAG 事件不计入 accepted_seq。只输出 JSON：actions（5 个枚举）、balance（整数）、accepted_seq（已接受的非 FLAG 事件 seq 升序数组）、flags（整数）。枚举为 APPLY、REJECT_DUP、REJECT_FUNDS、REFUND、FLAG。评分为 JSON exact-key schema、actions、balance、accepted_seq、flags 各 1 点。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_01.py
- id: architecture-extreme-02
  domain: architecture
  difficulty: extreme
  pass_criteria: 发布回滚时间线含不可逆迁移和读写兼容窗口
  prompt: |
    服务 v1 使用字段 price_cents，v2 需要 amount_cents。发布步骤固定：先部署能读旧写双字段的 v1.5；再双写；观察 10 分钟；最后切读。第 6 分钟发现 v2 错误率升高，但已有 120 条记录只写了 amount_cents。只输出 JSON：read_mode、rollback_mode、data_action、compat_window、lost_records。枚举必须来自：read_mode=OLD_FIRST/NEW_FIRST；rollback_mode=ROLL_BACK_APP_ONLY/ROLL_BACK_DATA；data_action=BACKFILL_THEN_RETRY/DROP_NEW_ONLY。compat_window 和 lost_records 为整数；lost_records 只计无法回填的丢失条数。
    五个字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_02.py
- id: architecture-extreme-03
  domain: architecture
  difficulty: extreme
  pass_criteria: fencing token 单调性和过期客户端写入均正确拒绝
  prompt: |
    存储层当前 fencing token=12。客户端 A 曾拿到 token=11，租约已过期；客户端 B 拿到 token=12 并已写入版本 4。A 的延迟写请求带 token=11，B 的第二次写带 token=12。只输出 JSON：a_result、b_result、stored_token、stored_version、lease_rule。a_result 和 b_result 必须依据存储层 token 检查推导；stored_token、stored_version 为最终整数；lease_rule 取 TOKEN_CHECK_AT_STORAGE/CLIENT_ONLY。
    五个字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_03.py
- id: architecture-extreme-04
  domain: architecture
  difficulty: extreme
  pass_criteria: 双区域故障切换后按版本向量解决冲突并保留审计信息
  prompt: |
    区域 east 最后状态为 {value:"A", east:5, west:3}，区域 west 最后状态为 {value:"B", east:4, west:4}。规则：向量可比较时取更大者；不可比较时不得静默覆盖，进入人工合并；本题人工合并选择 value="A+B"，向量取逐分量最大值。只输出 JSON：relation、resolution、value、vector、audit。relation 取 DOMINATES/DOMINATED/CONCURRENT；resolution 取 TAKE_LATER/MANUAL_MERGE；value、vector 和 audit 必须按上述冲突规则推导。
    五字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_04.py
- id: architecture-extreme-05
  domain: architecture
  difficulty: extreme
  pass_criteria: 共享预算、突发容量、拒绝策略和恢复顺序闭环
  prompt: |
    三个实例各有本地速率上限 100/s，但共享全局速率上限为 240/s；另有全局突发桶容量 60。每个整秒开始时先补充 240 个常规令牌（常规令牌不能跨秒累计），再补充 60 个突发令牌（突发令牌不能跨秒累计），本地上限仍须满足。第 1 秒三个实例各同时收到 100 个请求；第 2 秒只收到 east=20、west=20、central=20。请求先消耗本秒常规令牌，耗尽后才消耗突发令牌。不能因一致性哈希绕过共享预算；拒绝请求不返还已消耗令牌；恢复时优先重试带幂等键的请求。只输出 JSON：global_limit、burst_capacity、accepted_s1、accepted_s2、rejected_policy、recovery。前四个字段为整数；rejected_policy 取 DROP_NO_REFUND/REQUEUE；recovery 取 RETRY_IDEMPOTENT/FIFO_ALL。
    评分为 JSON exact-key schema 和六个字段各 1 点。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_05.py

- id: coding-easy-01
  domain: coding
  difficulty: easy
  pass_criteria: 连续相同整数压成 (值, 长度)，5 个 canonical cases
  prompt: |
    从左到右把连续相同整数压成 (值, 长度)。空列表返回空结果；不合并不相邻的相同值。按签名实现。
