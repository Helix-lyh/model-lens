  difficulty: medium
  pass_criteria: 5 行非常规文本协议，orchard 倒序且中间换成星号
  prompt: |
    按流程输出恰好 5 行纯文本。用一个 text 代码块包起来。不要解释。

    流程：
    1. 第 1 行必须完全等于 <<HEAD>>，左右无空格。
    2. 取单词 orchard，把字母倒序，作为第 2 行（只能是倒序结果）。
    3. 第 3 行是第 2 行的字符个数，只能是数字，不能带单位。
    4. 复制第 2 行得到第 4 行，再把正中间那一个字母换成 *。
    5. 第 5 行必须完全等于 <<TAIL>>，行末不能有空格，文件末不要第 6 行。
    6. 全文任何地方都不能出现正序的 orchard。
    7. 不要输出 markdown 标题，不要编号。
  grader:
    type: structure
    tests_file: bank/tests/c06_lines.py
- id: knowledge-medium-03
  domain: knowledge
  difficulty: medium
  pass_criteria: 单行 JSON，键序 z/a/z2，原文必须出现 -0
  prompt: |
    按流程输出单行 JSON。只输出 json 代码块，块内不能换行。

    流程：
    1. 对象的键必须按这个顺序出现：z，然后 a，然后 z2。
    2. z 的值是 {"z":{"z":"ok"}}，字符串 ok 全小写。
    3. a 的值是空数组。
    4. z2 的值在 JSON 原文里必须写成 -0（负号加零），解析后应是数字零。
    5. 整行除了 JSON 必要字符外，空格最多 3 个。
    6. 不要尾逗号，不要注释，不要第二个对象。
  grader:
    type: structure
    tests_file: bank/tests/c08_oneline.py
