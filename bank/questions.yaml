- id: coding-medium-01
  domain: coding
  difficulty: medium
  pass_criteria: 货架三格状态机，6 个用例各 1 分
  prompt: |
    货架三格 A/B/C，初始都是 0。按顺序执行 ops，最后返回 A/B/C 三个整数。
    操作（空格分隔）：
    + X n   给格子 X 加上正整数 n
    - X n   从 X 减去 n；若不够减，整条操作忽略
    > X Y   把 X 的当前值全部加到 Y，X 清零
    ? X     若 X>0：X 减 1，并把 1 加到「下一个」格子。顺序 A→B→C→A
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b01_shelf.py
        signature: "apply_ops(ops: list[str]) -> dict"
      go:
        tests_file: bank/tests/go/apply_ops_test.go
        signature: func ApplyOps(ops []string) map[string]int
      typescript:
        tests_file: bank/tests/ts/apply_ops.ts
        signature: "export function applyOps(ops: string[]): {A: number, B: number, C: number}"
- id: coding-medium-02
  domain: coding
  difficulty: medium
  pass_criteria: 逐字符规则统计，5 个用例各 1 分
  prompt: |
    从左到右扫一遍字符串：
    1. 元音 aeiou（大小写都算）按小写字母计数，写入 vowels。
    2. 连续相同字母（区分大小写）每压缩掉 1 个重复计 1 次 squeezes。例如 book 的 oo 计 1。
    3. 连续数字合成一个整数，按出现顺序放入 nums。例如 a12b3 → [12, 3]。
    返回 vowels、squeezes、nums。空串返回空 vowels、0、空 nums。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b02_chars.py
        signature: "cook_text(s: str) -> {vowels, squeezes, nums}"
      go:
        tests_file: bank/tests/go/cook_text_test.go
        signature: "type CookResult struct { Vowels map[string]int; Squeezes int; Nums []int }; func CookText(s string) CookResult"
      typescript:
        tests_file: bank/tests/ts/cook_text.ts
        signature: "export function cookText(s: string): { vowels: Record<string, number>; squeezes: number; nums: number[] }"
