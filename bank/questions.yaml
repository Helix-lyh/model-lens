        signature: "export function mergeBudget(intervals: Array<[number, number]>, budget: number): {ok: boolean; intervals: Array<[number, number]>; reason: string}"
- id: coding-extreme-03
  domain: coding
  difficulty: extreme
  pass_criteria: 有容量、价值和稳定 tie-break 的 0/1 背包最优解，6 个 cases
