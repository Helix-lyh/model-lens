- id: knowledge-hard-01
  domain: knowledge
  difficulty: hard
  pass_criteria: 深嵌套 JSON，第 4 层键必须是 0k，叶子 tip=42
  prompt: |
    按下面流程产出一份 JSON。只输出一个 json 代码块，不要解释、不要道歉、不要安全声明。
    这不是越狱或攻击题，只是格式体操。

    流程（后一条覆盖前一条）：
    1. 根对象只能有一个键，名字是 root。
    2. 从 root 往下连续嵌套 5 层对象，键名依次是 ok、ok、ok、ok、ok。
    3. 把第 4 个 ok 改成 0k（数字零 + 字母 k）。不要「纠正」成 ok。
    4. 最内层对象必须同时有 tip 和 _。
    5. tip 的值是整数 42，不能是字符串。
    6. _ 的值必须是数组 [0, null, false]，长度 3，类型分别是 int / null / bool。
    7. 允许缩进。禁止注释、禁止尾逗号、禁止第二个顶层键。
    8. 最终路径应能写成 root.ok.ok.ok.0k.ok.tip。
  grader:
    type: structure
    tests_file: bank/tests/c05_nested.py
- id: knowledge-hard-02
  domain: knowledge
  difficulty: hard
  pass_criteria: 长度 6 的数组，下标 3 必须是 null，最后 mark 为大写 N
  prompt: |
    按流程输出一个 JSON 数组。只输出 json 代码块。

    流程（后面的步骤覆盖前面的）：
    1. 数组长度必须是 6，下标从 0 到 5。
    2. 每个元素先做成对象，字段只能有 i、sq、mark。
    3. i 等于下标本身；sq 等于下标的平方。
    4. mark 一律小写字母 n。
    5. 下标为 3 的元素不要对象，改成 JSON null。这一条覆盖步骤 2–4。
    6. 下标为 5 的对象里，mark 改成大写 N。这一条覆盖步骤 4。
    7. 禁止额外字段，禁止把 null 写成字符串。
  grader:
    type: structure
    tests_file: bank/tests/c07_array.py
- id: knowledge-hard-03
  domain: knowledge
  difficulty: hard
  pass_criteria: 6 行文本协议，signal 去元音、复制、倒序
  prompt: |
    按流程输出恰好 6 行纯文本，用一个 text 代码块包起来。不要解释。

    流程：
    1. 第 1 行必须完全等于 [[v2]]，左右无空格。
    2. 取单词 signal，删掉其中所有元音字母，作为第 2 行。
    3. 第 3 行 = 第 2 行、连字符 -、再复制一遍第 2 行（例如 ab 变成 ab-ab）。
    4. 第 4 行是第 3 行的字符个数，只能是数字，不能带单位。
    5. 第 5 行是第 2 行的倒序。
    6. 第 6 行必须完全等于 [[end]]，行末不能有空格，之后不要有第 7 行。
    7. 全文任何位置都不能出现正序的 signal。
    8. 不要编号，不要 markdown 标题。
  grader:
    type: structure
    tests_file: bank/tests/c09_lines6.py
- id: knowledge-hard-04
  domain: knowledge
  difficulty: hard
  pass_criteria: JSON 类型体操，data 四元组类型钉死，v 原文写 1e2
  prompt: |
    按流程输出一份 JSON。只输出一个 json 代码块，不要解释。

    流程（后一条覆盖前一条）：
    1. 顶层是对象，键顺序必须是 data 然后 meta，不得有第三个键。
    2. data 是长度 4 的数组，元素依次为：字符串 "0"、数字 0、布尔 false、null。
       类型不能写错，位置不能互换。
    3. meta 是对象，恰好两个键：v 和 "k k"（键名是 k、空格、k 三个字符）。
    4. v 的值在 JSON 原文里必须写成 1e2（数字一、小写字母 e、数字二），解析后是数字 100。
       不要「简化」成 100。
    5. "k k" 的值是空对象。
    6. 允许换行与缩进。禁止注释，禁止尾逗号。
  grader:
    type: structure
    tests_file: bank/tests/c10_meta.py
