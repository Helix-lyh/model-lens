        signature: "bounded_knapsack(items: list[tuple[int, int]], capacity: int) -> dict"
      go:
        tests_file: bank/tests/go/knapsack_test.go
        signature: "func BoundedKnapsack(items [][2]int, capacity int) map[string]interface{}"
      typescript:
        tests_file: bank/tests/ts/knapsack.ts
        signature: "export function boundedKnapsack(items: Array<[number, number]>, capacity: number): {value: number; weight: number; indices: number[]}"
- id: coding-extreme-04
