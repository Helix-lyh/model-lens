- id: coding-medium-04
  domain: coding
  difficulty: medium
  pass_criteria: 模板占位符替换与花括号转义，6 个用例
  prompt: |
    实现模板渲染，从左到右扫描：
    1. "{{" 输出一个 "{"，"}}" 输出一个 "}"（转义优先于占位符）。
    2. "{name}" 中 name 只含字母、数字、下划线且非空：vars 里有 name 就替换成对应字符串；
       没有则整段原样保留（含花括号）。
    3. 其余的 "{" 或 "}"（含 "{a b}" 这类非法占位符、未闭合的 "{"）原样输出。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b10_render.py
        signature: "render(template: str, vars: dict[str, str]) -> str"
      go:
        tests_file: bank/tests/go/render_test.go
        signature: func Render(template string, vars map[string]string) string
      typescript:
        tests_file: bank/tests/ts/render.ts
        signature: "export function render(template: string, vars: Record<string, string>): string"
- id: coding-hard-01
  domain: coding
  difficulty: hard
  pass_criteria: FreezeBag 冻结键不淘汰，4 个状态点
  prompt: |
    实现容量为 capacity 的 FreezeBag：
    put(key, value) 写入；get(key) 未命中表示没有该键。
    freeze(key) 之后该键不会被淘汰。容量满时淘汰「最久未 put 且未冻结」的键。
    若剩下的键全部已冻结，新 put 的非冻结新键直接忽略（已有键仍可更新值）。
    get 不改变淘汰顺序。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b03_freeze.py
        signature: class FreezeBag(capacity); put/get/freeze；get 未命中返回 None
      go:
        tests_file: bank/tests/go/freeze_bag_test.go
        signature: NewFreezeBag(capacity int) *FreezeBag；Put/Get/Freeze；Get 返回 (int, bool)
      typescript:
        tests_file: bank/tests/ts/freeze_bag.ts
        signature: "export class FreezeBag { constructor(capacity: number); put(key: string, value: number): void; get(key: string): number | null; freeze(key: string): void }"
- id: coding-hard-02
  domain: coding
  difficulty: hard
  pass_criteria: SafeCounter 计数 1 分
  prompt: |
    实现计数器：increment 加一，value 返回当前值。
    Python：必须线程安全，多线程同时 increment 不能丢计数。
    Go：必须并发安全，多 goroutine 同时 Increment 不能丢计数。
    TypeScript：单线程连续 increment 1600 次，value 必须为 1600（不测数据竞争）。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b06_safe_counter.py
        signature: class SafeCounter; increment(); value()
      go:
        tests_file: bank/tests/go/safe_counter_test.go
        signature: NewSafeCounter() *SafeCounter；Increment(); Value() int
      typescript:
        tests_file: bank/tests/ts/safe_counter.ts
        signature: "export class SafeCounter { increment(): void; value(): number }"
        prompt_suffix: 本题 TypeScript 只在单线程连续调用，不要假装有数据竞争。
- id: coding-hard-03
  domain: coding
  difficulty: hard
  pass_criteria: 滑动窗口限流器，左开右闭、拒绝不计数，6 个用例
  prompt: |
    实现滑动窗口限流器，构造时给 limit 和 window（秒）。
    allow(ts)：ts 是不减的整数秒。统计时间区间 (ts-window, ts] 内已被允许的请求数：
    小于 limit 则本次允许、计入统计并返回真；否则返回假，且被拒绝的请求不计入统计。
    注意区间左开右闭：恰好在 ts-window 时刻被允许的旧请求已经过期。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b11_limiter.py
