    - - 总而言之
    - - 作为一名
    must_include:
    - - 日志
      - log
    - - 指标
      - metric
      - 监控
    - - 追踪
      - trace
      - span
    - - 请求
      - 链路
      - 调用链
- id: architecture-hard-01
