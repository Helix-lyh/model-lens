- id: coding-hard-01
  domain: coding
  difficulty: hard
  pass_criteria: 冻结键不能淘汰且 put 顺序确定，4 个 cases
  prompt: |
    实现容量为 capacity 的 FreezeBag。put 更新或插入并记录最近 put；freeze 后键不可淘汰；满时淘汰最久未 put 且未冻结者；若没有可淘汰键则忽略新键；get 不改变顺序。按签名实现。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b03_freeze.py
        signature: "class FreezeBag(capacity: int); put(key: str, value: int); get(key: str) -> int | None; freeze(key: str)"
      go:
        tests_file: bank/tests/go/freeze_bag_test.go
        signature: "NewFreezeBag(capacity int) *FreezeBag; Put/Get/Freeze; Get returns (int, bool)"
      typescript:
        tests_file: bank/tests/ts/freeze_bag.ts
        signature: "export class FreezeBag { constructor(capacity: number); put(key: string, value: number): void; get(key: string): number | null; freeze(key: string): void }"
- id: coding-hard-02
  domain: coding
  difficulty: hard
  pass_criteria: 左开右闭滑动窗口，拒绝请求不计入，6 个 cases
  prompt: |
    实现 SlidingLimiter(limit, window)。allow(ts) 只接收不递减整数秒；统计 (ts-window, ts] 内已经允许的请求，拒绝不计入。时间恰为边界时旧请求过期。按签名实现。
