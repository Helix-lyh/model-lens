- id: coding-easy-01
  domain: coding
  difficulty: easy
  pass_criteria: 连续相同整数压成 (值, 长度)，5 个用例
  prompt: |
    从左到右把连续相同的整数压成 (值, 长度)。例如 [1,1,1,2,2] → [(1,3),(2,2)]。
    空列表返回空结果。不要合并不相邻的相同值。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b04_pack_runs.py
        signature: "pack_runs(xs: list[int]) -> list[tuple[int,int]]"
      go:
        tests_file: bank/tests/go/pack_runs_test.go
        signature: func PackRuns(xs []int) [][2]int
      typescript:
        tests_file: bank/tests/ts/pack_runs.ts
        signature: "export function packRuns(xs: number[]): Array<[number, number]>"
