- id: architecture-extreme-04
  domain: architecture
  difficulty: extreme
  pass_criteria: 双区域故障切换后按版本向量解决冲突并保留审计信息
  prompt: |
    区域 east 最后状态为 {value:"A", east:5, west:3}，区域 west 最后状态为 {value:"B", east:4, west:4}。规则：向量可比较时取更大者；不可比较时不得静默覆盖，进入人工合并；本题人工合并选择 value="A+B"，向量取逐分量最大值。只输出 JSON：relation、resolution、value、vector、audit。
    relation 取 DOMINATES / DOMINATED / CONCURRENT；resolution 取 TAKE_LATER / MANUAL_MERGE；audit 取 RETAIN_BOTH / TAKE_DOMINANT。value 与 vector 按冲突规则推导。五字段各 1 分。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_04.py
- id: architecture-extreme-05
  domain: architecture
  difficulty: extreme
  pass_criteria: 共享预算、突发容量、拒绝策略和恢复顺序闭环
  prompt: |
    三个实例各有本地速率上限 100/s，但共享全局速率上限为 240/s；另有全局突发桶容量 60。每个整秒开始时先补充 240 个常规令牌（常规令牌不能跨秒累计），再补充 60 个突发令牌（突发令牌不能跨秒累计），本地上限仍须满足。第 1 秒三个实例各同时收到 100 个请求；第 2 秒只收到 east=20、west=20、central=20。请求先消耗本秒常规令牌，耗尽后才消耗突发令牌。不能因一致性哈希绕过共享预算；拒绝请求不返还已消耗令牌；恢复时优先重试带幂等键的请求。只输出 JSON：global_limit、burst_capacity、accepted_s1、accepted_s2、rejected_policy、recovery。前四个字段为整数；rejected_policy 取 DROP_NO_REFUND/REQUEUE；recovery 取 RETRY_IDEMPOTENT/FIFO_ALL。
    评分为 JSON exact-key schema 和六个字段各 1 点。
  grader:
    type: structure
    tests_file: bank/tests/a_extreme_05.py

- id: coding-easy-01
  domain: coding
  difficulty: easy
  pass_criteria: 连续相同整数压成 (值, 长度)，5 个 canonical cases
  prompt: |
    从左到右把连续相同整数压成 (值, 长度)。空列表返回空结果；不合并不相邻的相同值。按签名实现。
