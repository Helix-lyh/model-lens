        tests_file: bank/tests/b13_replay_counter.py
        signature: "replay_counter(log: list[tuple[str, str, int]]) -> dict"
      go:
        tests_file: bank/tests/go/replay_counter_test.go
        signature: "func ReplayCounter(log [][3]interface{}) map[string]interface{}"
      typescript:
        tests_file: bank/tests/ts/replay_counter.ts
        signature: "export function replayCounter(log: Array<[string, string, number]>): {balance: number; accepted: string[]; rejected: string[]}"
- id: coding-extreme-02
  domain: coding
  difficulty: extreme
  pass_criteria: 闭区间预算合并、不可重叠资源和失败原因，6 个 cases
  prompt: |
    实现 merge_budget(intervals, budget)。intervals 是闭区间 [l,r]，每段 l<=r；先按 l 再按 r 排序；两个区间重叠时合并，恰好满足 next_l=current_r+1 时也视为相邻并合并；合并后的总覆盖点数超过 budget 返回失败，否则返回规范化区间。budget 必须是非负整数，非法区间或非法 budget 都返回 invalid。返回 {ok, intervals, reason}，成功 reason 为 empty，失败 reason 为 invalid 或 budget_exceeded。
  grader:
