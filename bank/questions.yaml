- id: coding-medium-01
  domain: coding
  difficulty: medium
  pass_criteria: 三格确定性事件状态机，6 个 canonical cases
  prompt: |
    货架 A/B/C 初始为 0。逐条执行操作：+ X n 加正整数；- X n 不足则忽略；> X Y 将 X 全部移至 Y；? X 若 X>0 则减一并转给下一个格子 A→B→C→A。返回最终对象。按签名实现。
  grader:
    type: code_tests
    languages:
      python:
        tests_file: bank/tests/b01_shelf.py
        signature: "apply_ops(ops: list[str]) -> dict[str, int]"
      go:
        tests_file: bank/tests/go/apply_ops_test.go
        signature: "func ApplyOps(ops []string) map[string]int"
      typescript:
