  pass_criteria: MVCC 快照读取、写集合冲突和提交版本确定，6 个 cases
  prompt: |
    实现 apply_transactions(initial, txns)。初始对象的每个键版本为 0；事务为 {id, begin, writes, commit}，在 begin 版本读取快照。按 commit 升序（再按输入顺序）处理；已提交事务的全局版本从 1 递增。事务的任一写入键若 latest_version > begin，则整体 ABORT，否则把 writes 应用到 state 并提交。提交版本等于下一递增版本；ABORT 不写入且不分配版本。返回最终 state 和 statuses，statuses 按输入事务 id 的插入顺序保留（值为 COMMIT/ABORT）。
