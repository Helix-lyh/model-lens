  domain: architecture
  difficulty: extreme
  pass_criteria: fencing与CAS先后顺序及失败不得抬高token
  prompt: '存储当前token=8、version=3、value=0。依序收到(token,expected_version,new_value)：(9,3,10)、(8,4,20)、(10,3,30)、(9,4,40)、(10,5,50)。先拒绝token<当前的STALE；否则比较版本，不同则CONFLICT且不更新token；通过则ACCEPT，更新token/value，version加1。同token可写。输出JSON：actions、token、version、value。

