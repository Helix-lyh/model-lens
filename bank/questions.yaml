- id: coding-extreme-01
  domain: coding
  difficulty: extreme
  pass_criteria: 乱序、重复和冲正事件的确定性重放，7 个 cases
  prompt: |
    实现 replay_counter(log)。每条事件为 [event_id, kind, amount]，kind 为 credit/debit/refund。按输入顺序处理；同一 event_id 只接受第一次；credit 增加余额；debit 仅在余额足够时接受，否则拒绝但仍占用 event_id；refund 仅在存在此前接受且尚有未冲正额度的 debit 时接受，按 debit 接受顺序选择第一个剩余额度足够者，并增加余额，否则拒绝。返回 {balance, accepted, rejected}，accepted/rejected 为按处理顺序排列的 event_id。初始余额 0。不得排序输入。
