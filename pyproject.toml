[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lens"
version = "0.1.0"
description = "OpenAI-compatible family / identity / degrade audit (personal, not forensic)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
model-lens = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
